teaching_hooks:
  - id: files-are-not-behavior
    audience: owner
    hook: The feature spec can say Done while the play button only changes an icon.
    concept: Acceptance criteria have to name a behavior, not a filename.
  - id: two-manifests
    audience: owner
    hook: Two commits say the dependency conflict is fixed, and the lockfile still records the old React.
    concept: package.json and package-lock.json are both the contract. A one-file edit leaves the install on the previous resolution.
  - id: live-is-a-timer
    audience: owner
    hook: The feed says Connected because the JSX says Connected.
    concept: A component name and a status dot are not a network.
  - id: use-frame-wins
    audience: owner
    hook: GSAP aims the globe, and the render loop assigns rotation from elapsed time on the next frame.
    concept: Two writers on one property. The absolute assignment is the steady state.
  - id: optional-peers
    audience: agent
    hook: Expo is in package.json because fiber lists it as an optional peer, and the page never imports it.
    concept: Read peerDependenciesMeta before treating a native package as part of a website.
  - id: diagram-drift
    audience: agent
    hook: The architecture diagram points at the globe file the page does not import.
    concept: Trace the import from the route before editing the file the doc names.
  - id: random-city
    audience: tutor
    hook: Click the same city twice and the population changes.
    concept: Math.random() in render-adjacent effects is not a data model.
