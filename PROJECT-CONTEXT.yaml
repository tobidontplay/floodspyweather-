risks:
  - id: unnamed-data-source
    severity: high
    summary: Screen copy says real-time monitoring. Data is fixtures and Math.random(). The TODO still asks for a decision.
    evidence: TODO.md
    confidence: high
  - id: split-install-contract
    severity: high
    summary: package.json asks for React 18 and date-fns 3. The lockfile resolves React 19.1.0 and date-fns 4.1.0. Fiber 9 peers React 19. react-day-picker 8 peers React 18 and is unused.
    evidence: package-lock.json
    confidence: high
  - id: controls-do-not-match-labels
    severity: high
    summary: Timeline playback, date filtering, toasts, and globe layer buttons do not perform the action the control names.
    evidence: components/timeline-viewer.tsx
    confidence: high
  - id: build-ignores-errors
    severity: medium
    summary: next build is configured to ignore TypeScript and ESLint errors. There is no test script and no CI workflow.
    evidence: next.config.mjs
    confidence: high
  - id: stale-architecture-doc
    severity: medium
    summary: The overview diagram points at globe-interface.tsx, which the page does not import.
    evidence: docs/architecture/overview.md
    confidence: high
  - id: double-webgl-canvas
    severity: low
    summary: Two PersistentGlobe trees mount and CSS hides one. Context loss on a real GPU was not observed.
    evidence: app/page.tsx
    confidence: medium
  - id: animation-frame-leak
    severity: low
    summary: Particle rain cleanup does not cancel requestAnimationFrame.
    evidence: components/particle-rain.tsx
    confidence: high
  - id: fleet-paused
    severity: medium
    summary: Audit brief says the Ariadne fleet status is paused. The repo does not store that field. auto_start is false.
    evidence: project.yaml
    confidence: medium

